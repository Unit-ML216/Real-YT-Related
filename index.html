<!DOCTYPE html>
<html>
<head>
  <title>Real YT Related</title>
</head>
<body>
  <h1>Real YT Related</h1>

<p>Paste a YouTube video URL:</p>
  
<input id="videoUrl" type="text" size="60">
  <button onclick="makeSearches()">Make related searches</button>
<div id="player"></div>
  <div id="results"></div>
<div id="videoResults"></div>
  <script>
    function getVideoId(url) {
  try {
    const parsedUrl = new URL(url);

    if (parsedUrl.hostname.includes("youtu.be")) {
      return parsedUrl.pathname.slice(1);
    }

    if (parsedUrl.hostname.includes("youtube.com")) {
      return parsedUrl.searchParams.get("v");
    }

    return null;
  } catch {
    return null;
  }
}
    async function searchYouTube(query) {
  const response = await fetch(
    "https://www.googleapis.com/youtube/v3/search" +
    "?part=snippet" +
    "&type=video" +
    "&maxResults=10" +
    "&q=" + encodeURIComponent(query) +
    "&key=" + encodeURIComponent(YOUTUBE_API_KEY)
  );

  const data = await response.json();

  if (!response.ok) {
    console.error("YouTube search error:", data);
    alert("YouTube search failed. Check the JavaScript console.");
    return [];
  }

  return data.items || [];
}
async function getVideoDetails(videos) {
  const ids = videos.map(video => video.id.videoId).join(",");

  const response = await fetch(
    "https://www.googleapis.com/youtube/v3/videos" +
    "?part=snippet,statistics" +
    "&id=" + encodeURIComponent(ids) +
    "&key=" + encodeURIComponent(YOUTUBE_API_KEY)
  );

  const data = await response.json();

  if (!response.ok) {
    console.error("YouTube video details error:", data);
    return [];
  }

  return data.items || [];
}
    
  async function makeSearches() {
  const url = document.getElementById("videoUrl").value.trim();
  const videoId = getVideoId(url);
document.getElementById("player").innerHTML =
  '<iframe ' +
  'src="https://www.youtube.com/embed/' + videoId + '" ' +
  'title="YouTube video player" ' +
  'style="width:100%; max-width:900px; aspect-ratio:16/9; border:0;" ' +
  'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
  'allowfullscreen></iframe>';
  if (!videoId) {
    alert("I couldn't recognize that YouTube URL.");
    return;
  }

    const response = await fetch(
  "https://www.googleapis.com/youtube/v3/videos" +
  "?part=snippet" +
  "&id=" + encodeURIComponent(videoId) +
  "&key=" + encodeURIComponent(YOUTUBE_API_KEY)
);

const data = await response.json();

if (!data.items || data.items.length === 0) {
  alert("I couldn't find that YouTube video.");
  return;
}

const title = data.items[0].snippet.title;
    const videos = await searchYouTube(title);
console.log("Search results:", videos);
    const videoDetails = await getVideoDetails(videos);
console.log("Video details:", videoDetails);
const videoResults = document.getElementById("videoResults");
videoResults.innerHTML = "<h2>Related videos</h2>";

videoDetails.forEach(video => {
  const videoId = video.id;
  const videoTitle = video.snippet.title;
  const channel = video.snippet.channelTitle;
  const views = Number(video.statistics.viewCount || 0).toLocaleString();
  const published = new Date(video.snippet.publishedAt).toLocaleDateString();

  const link = document.createElement("a");
  link.href = "https://www.youtube.com/watch?v=" + videoId;
  link.textContent = videoTitle;
  link.target = "_blank";

  const metadata = document.createElement("div");
  metadata.textContent =
    channel + " · " + views + " views · " + published;

  const paragraph = document.createElement("p");
  paragraph.appendChild(link);
  paragraph.appendChild(document.createElement("br"));
  paragraph.appendChild(metadata);

  videoResults.appendChild(paragraph);
});
      const searches = [
        title,
        title + " gameplay",
        title + " guide",
        title + " analysis"
      ];

      const results = document.getElementById("results");
      results.innerHTML = "<h2>Related searches</h2>";

      searches.forEach(search => {
        const link = document.createElement("a");
        link.href =
          "https://www.youtube.com/results?search_query=" +
          encodeURIComponent(search);
        link.textContent = search;
        link.target = "_blank";

        const paragraph = document.createElement("p");
        paragraph.appendChild(link);
        results.appendChild(paragraph);
      });
    }
    const YOUTUBE_API_KEY = "AIzaSyC4HKUt-PGeQX6Px58r3Hy6abOK6yFfBuU"
  </script>
</body>
</html>
