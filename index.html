<!DOCTYPE html>
<html>
<head>
  <title>Real YT Related</title>
</head>
<body>
  <h1>Real YT Related</h1>

<p>Paste a YouTube video URL:</p>
<input id="videoUrl" type="text" size="60">
<button onclick="makeSearches()">Play and Display Related</button>

<hr>

<p>Search YouTube in general:</p>
<input id="searchQuery" type="text" size="60">
<button onclick="runManualSearch()">Search</button>
  
<div id="player"></div>
<div id="currentVideoMeta"></div>
<div id="videoResults"></div>
  <script>
    function getVideoId(url) {
  try {
    const parsedUrl = new URL(url);

    if (parsedUrl.hostname.includes("youtu.be")) {
      return parsedUrl.pathname.slice(1);
    }

    if (parsedUrl.hostname.includes("youtube.com")) {
      return parsedUrl.searchParams.get("v");
    }

    return null;
  } catch {
    return null;
  }
}
    async function searchYouTube(query) {
  const response = await fetch(
    "https://www.googleapis.com/youtube/v3/search" +
    "?part=snippet" +
    "&type=video" +
    "&maxResults=10" +
    "&q=" + encodeURIComponent(query) +
    "&key=" + encodeURIComponent(YOUTUBE_API_KEY)
  );

  const data = await response.json();

  if (!response.ok) {
    console.error("YouTube search error:", data);
    alert("YouTube search failed. Check the JavaScript console.");
    return [];
  }

  return data.items || [];
}
async function getVideoDetails(videos) {
  const ids = videos.map(video => video.id.videoId).join(",");

  const response = await fetch(
    "https://www.googleapis.com/youtube/v3/videos" +
"?part=snippet,statistics,contentDetails" +
    "&id=" + encodeURIComponent(ids) +
    "&key=" + encodeURIComponent(YOUTUBE_API_KEY)
  );

  const data = await response.json();

  if (!response.ok) {
    console.error("YouTube video details error:", data);
    return [];
  }

  return data.items || [];
}
function formatDuration(duration) {
  const match = duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);

  const hours = parseInt(match[1] || 0);
  const minutes = parseInt(match[2] || 0);
  const seconds = parseInt(match[3] || 0);

  if (hours > 0) {
    return hours + ":" +
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0");
  }

  return minutes + ":" + String(seconds).padStart(2, "0");
}
async function runManualSearch() {
  const query = document.getElementById("searchQuery").value.trim();

  if (!query) {
    return;
  }

  const videos = await searchYouTube(query);
  const videoDetails = await getVideoDetails(videos);

  const videoResults = document.getElementById("videoResults");
  videoResults.innerHTML = "<h2>Search results</h2>";

  videoDetails.forEach(video => {
    const videoId = video.id;
    const videoTitle = video.snippet.title;
    const channel = video.snippet.channelTitle;
    const views = Number(video.statistics.viewCount || 0).toLocaleString();
    const published = new Date(video.snippet.publishedAt).toLocaleDateString();
    const duration = formatDuration(video.contentDetails.duration);

    const link = document.createElement("a");
    link.href = "#";
    link.textContent = videoTitle;

    link.onclick = function(event) {
      event.preventDefault();

      document.getElementById("videoUrl").value =
        "https://www.youtube.com/watch?v=" + videoId;

      makeSearches();
    };

    const metadata = document.createElement("div");
   metadata.textContent =
  channel + " · " + views + " views · " + published + " · " + duration;
    
    const paragraph = document.createElement("p");
    paragraph.appendChild(link);
    paragraph.appendChild(document.createElement("br"));
    paragraph.appendChild(metadata);

    videoResults.appendChild(paragraph);
  });
}
    
  async function makeSearches() {
  const url = document.getElementById("videoUrl").value.trim();
  const videoId = getVideoId(url);
document.getElementById("player").innerHTML =
  '<iframe ' +

  'title="YouTube video player" ' +
  'style="width:100%; max-width:900px; aspect-ratio:16/9; border:0;" ' +
  'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
  'allowfullscreen></iframe>';
  if (!videoId) {
    alert("I couldn't recognize that YouTube URL.");
    return;
  }

    const response = await fetch(
  "https://www.googleapis.com/youtube/v3/videos" +
"?part=snippet,statistics,contentDetails" +
      "&id=" + encodeURIComponent(videoId) +
  "&key=" + encodeURIComponent(YOUTUBE_API_KEY)
);

const data = await response.json();

if (!data.items || data.items.length === 0) {
  alert("I couldn't find that YouTube video.");
  return;
}

const title = data.items[0].snippet.title;

const currentVideo = data.items[0];
const currentChannel = currentVideo.snippet.channelTitle;
const currentViews = Number(
  currentVideo.statistics.viewCount || 0
).toLocaleString();
const currentPublished = new Date(
  currentVideo.snippet.publishedAt

const currentDuration = formatDuration(
  currentVideo.contentDetails.duration

const currentVideoMeta =
  document.getElementById("currentVideoMeta");

currentVideoMeta.innerHTML =
  "<p><strong>" + title + "</strong><br>" +
  currentChannel + " · " +
  currentViews + " views · " +
  currentPublished + " · " +
  currentDuration + "</p>";
    
    const videos = await searchYouTube(title);
console.log("Search results:", videos);
    const videoDetails = await getVideoDetails(videos);
console.log("Video details:", videoDetails);
const videoResults = document.getElementById("videoResults");
videoResults.innerHTML = "<h2>1st 10 Related videos (searches Video Title in YT search)</h2>";

videoDetails.forEach(video => {
  const videoId = video.id;
  const videoTitle = video.snippet.title;
  const channel = video.snippet.channelTitle;
  const views = Number(video.statistics.viewCount || 0).toLocaleString();
  const published = new Date(video.snippet.publishedAt).toLocaleDateString();
  const duration = formatDuration(video.contentDetails.duration);

  const link = document.createElement("a");

  link.href = "#";
link.textContent = videoTitle;

link.onclick = function(event) {
  event.preventDefault();

  document.getElementById("videoUrl").value =
    "https://www.youtube.com/watch?v=" + videoId;

  makeSearches();
};

  const metadata = document.createElement("div");
 metadata.textContent =
  channel + " · " + views + " views · " + published + " · " + duration;

  const paragraph = document.createElement("p");
  paragraph.appendChild(link);
  paragraph.appendChild(document.createElement("br"));
  paragraph.appendChild(metadata);

  videoResults.appendChild(paragraph);
});
      
    }
    const YOUTUBE_API_KEY = "AIzaSyC4HKUt-PGeQX6Px58r3Hy6abOK6yFfBuU"
  </script>
</body>
</html>
